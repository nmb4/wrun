[package]
name = "wrun"
version = "0.5.0"
edition = "2024"
description = "A CLI runner for Wren scripts with system integration"
license = "MIT"

[dependencies]
ruwren = { path = "deps/ruwren" }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
notify = "6"
similar = "2"
diffy = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
